name: Desplegar

# Manual, a propósito: el despliegue no se dispara solo al empujar código.
# Se elige la versión y se ejecuta desde la pestaña Actions.
#
# POR QUÉ NO SE PUBLICA UNA IMAGEN
#
# El servidor es un Ampere de Oracle (aarch64) y los ejecutores de GitHub son
# amd64. Se probó a construir para las dos arquitecturas con QEMU y el paso
# emulado llevaba más de dos horas sin terminar: emular un Maven y un Node
# completos no es viable. En el servidor, en cambio, la misma construcción
# tarda dos minutos porque es ARM nativo.
#
# Así que el despliegue copia el código y construye allí. La imagen queda
# etiquetada con la versión, lo que permite volver a una anterior.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#
#   SSH_HOST          dirección del servidor
#   SSH_USER          usuario
#   SSH_KEY           clave privada completa, con el -----BEGIN…
#   RUTA_DESPLIEGUE   carpeta del compose, por ejemplo /opt/sirve-p
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta o rama a desplegar (v1.0.2, main…)'
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:

  desplegar:
    name: Construir y desplegar en el servidor
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Traer la versión pedida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Empaquetar el código
        run: |
          # git archive deja fuera lo ignorado: node_modules, target, db/ y .env
          # no viajan, y en el servidor se conservan los que ya están.
          git archive --format=tar -o /tmp/sirve-src.tar HEAD
          ls -lh /tmp/sirve-src.tar

      - name: Copiar y construir
        run: |
          scp -i ~/.ssh/id_deploy /tmp/sirve-src.tar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/sirve-src.tar"

          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
             # Se construye en /tmp y se borra al terminar: en la carpeta de
             # despliegue solo quedan el compose y los archivos de operación.
             # El código viaja, se compila y desaparece; lo que permanece es la
             # imagen, que es lo que realmente ejecuta.
             rm -rf /tmp/sirve-build
             mkdir -p /tmp/sirve-build
             tar -x -f /tmp/sirve-src.tar -C /tmp/sirve-build
             rm -f /tmp/sirve-src.tar
             cd /tmp/sirve-build
             echo 'Construyendo sirve-p:${{ inputs.version }}…'
             # «sudo env» y no «VAR=… sudo»: sudo reinicia el entorno y la
             # variable se perdería, dejando el compose con el nombre del .env.
             sudo -n env IMAGEN_APP='sirve-p:${{ inputs.version }}' docker compose build app
             # El compose de producción se actualiza solo si cambió en el repo.
             sudo -n cp docker-compose.yml '${{ secrets.RUTA_DESPLIEGUE }}/docker-compose.yml'
             cd '${{ secrets.RUTA_DESPLIEGUE }}'
             sudo -n env IMAGEN_APP='sirve-p:${{ inputs.version }}' docker compose up -d --no-build app
             rm -rf /tmp/sirve-build
            "

      - name: Verificar que responde
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "for i in \$(seq 1 30); do
               if curl -fsS http://127.0.0.1:8088/actuator/health/liveness > /dev/null 2>&1; then
                 echo 'La aplicación responde.'
                 curl -s http://127.0.0.1:8088/api/procesos | head -c 200
                 exit 0
               fi
               sleep 3
             done
             echo 'No respondió; últimas líneas del registro:'
             cd '${{ secrets.RUTA_DESPLIEGUE }}' && sudo -n docker compose logs --tail 30 app
             exit 1
            "

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Despliegue de ${{ inputs.version }}"
            echo ""
            echo "Servidor: \`${{ secrets.SSH_HOST }}\`"
            echo ""
            echo "Resultado: **${{ job.status }}**"
            echo ""
            echo "Imagen construida: \`sirve-p:${{ inputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
