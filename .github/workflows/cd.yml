name: Desplegar

# ---------------------------------------------------------------------------
# Construye la imagen en GitHub y el servidor solo la descarga.
#
# Antes se compilaba en el servidor. Con 4 vCPU y 22 GB eso era rápido, pero
# el servidor actual tiene 1 GB y el `docker build` de SIRVE necesita ~1.5 GB:
# se quedaba sin memoria a media compilación. Construir en el runner de GitHub
# resuelve eso y de paso el servidor queda con menos trabajo y menos caché.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta o rama a desplegar (v1.0.2, main…)'
        required: true
        type: string
        default: main

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/sirve

jobs:

  desplegar:
    name: Construir, publicar y desplegar
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Traer la versión pedida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Entrar al registro de imágenes
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGEN }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en el servidor
        run: |
          # El servidor entra al registro con el token de esta corrida: el
          # paquete es privado y el token se manda por la entrada estándar,
          # nunca en la línea de comandos.
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "sudo -n docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          # El código ya no viaja: solo el compose. La imagen se descarga.
          scp -i ~/.ssh/id_deploy docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/docker-compose.yml"

          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
             sudo -n cp /tmp/docker-compose.yml '${{ secrets.RUTA_DESPLIEGUE }}/docker-compose.yml'
             rm -f /tmp/docker-compose.yml
             cd '${{ secrets.RUTA_DESPLIEGUE }}'
             echo 'Descargando ${{ env.IMAGEN }}:${{ inputs.version }}…'
             sudo -n env IMAGEN_APP='${{ env.IMAGEN }}:${{ inputs.version }}' docker compose pull app
             sudo -n env IMAGEN_APP='${{ env.IMAGEN }}:${{ inputs.version }}' docker compose up -d --no-build

             # La versión queda escrita en el .env: un «docker compose up» a mano
             # no debe devolver una imagen vieja.
             sudo -n sed -i 's#^IMAGEN_APP=.*#IMAGEN_APP=${{ env.IMAGEN }}:${{ inputs.version }}#' .env
             sudo -n grep IMAGEN_APP .env
            "

      - name: Limpiar versiones viejas
        # Cada imagen son ~340 MB. Se conservan la actual y la anterior: volver
        # atrás debe ser cambiar la etiqueta en el .env, no volver a descargar.
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set +e
             ACTUAL=\$(sudo -n docker inspect sirve-p-app-1 --format '{{.Config.Image}}')
             sudo -n docker image prune -f > /dev/null 2>&1
             echo \"Imagen en uso: \$ACTUAL\"
             df -h / | tail -1
            "

      - name: Verificar que responde
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "for i in \$(seq 1 40); do
               if sudo -n docker exec sirve-p-app-1 wget -qO- http://127.0.0.1:8080/api/version 2>/dev/null; then
                 echo ''
                 echo 'La aplicación responde.'
                 exit 0
               fi
               sleep 3
             done
             echo 'No respondió; últimas líneas del registro:'
             cd '${{ secrets.RUTA_DESPLIEGUE }}' && sudo -n docker compose logs --tail 40 app
             exit 1
            "

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Despliegue de ${{ inputs.version }}"
            echo ""
            echo "Servidor: \`${{ secrets.SSH_HOST }}\`"
            echo ""
            echo "Resultado: **${{ job.status }}**"
            echo ""
            echo "Imagen publicada: \`${{ env.IMAGEN }}:${{ inputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
