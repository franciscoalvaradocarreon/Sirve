name: Publicar la imagen

# Se dispara al empujar una etiqueta de versión:
#     git tag v1.0.0 && git push origin v1.0.0
#
# Publica la imagen en GitHub Container Registry con tres etiquetas: la
# versión, el commit corto y «latest». En el servidor se despliega con
# «docker compose pull», sin compilar nada allí.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:

  imagen:
    name: Imagen en GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El servidor es un Ampere de Oracle (aarch64). Sin QEMU la imagen sale
      # solo para amd64 y al descargarla responde «no matching manifest for
      # linux/arm64».
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GITHUB_REPOSITORY llega como «usuario/Sirve». GHCR exige minúsculas.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "## Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Para desplegar en el servidor: **Actions → Desplegar → Run workflow**"
          } >> "$GITHUB_STEP_SUMMARY"
