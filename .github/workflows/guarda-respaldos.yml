name: Guardia de respaldos

# Responde a una sola pregunta: ¿los respaldos automáticos funcionan?
#
# Nace de un fallo real: en el servidor anterior los respaldos corrían de noche,
# fallaban sin avisar y nadie lo supo hasta que se perdió la instancia. Un
# respaldo que no se comprueba no es un respaldo.
#
# La comprobación vive en el servidor, en mantenimiento/verificar-respaldo.sh,
# para poder correrla también a mano. Aquí solo se entra por SSH y se mira su
# código de salida.
#
# Si este trabajo falla, GitHub avisa por correo al autor del último cambio de
# este archivo. Para lanzarlo a mano: Actions → Guardia de respaldos → Run.

on:
  schedule:
    # El respaldo corre a las 09:00 UTC (03:00 de Monterrey). A las 12:00 UTC ya
    # debería existir el del día.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  verificar:
    name: Comprobar el respaldo más reciente
    runs-on: ubuntu-latest
    steps:

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # printf (no echo) para garantizar el salto de línea final que OpenSSH exige.
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Verificar que la clave es válida
        run: |
          # ssh-keygen -y falla si la clave privada está corrupta o le faltan las
          # líneas BEGIN/END: así un secreto mal pegado se ve aquí y no más tarde
          # como un «Permission denied» que despista.
          if ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            ssh-keygen -lf ~/.ssh/id_ed25519
          else
            echo "::error::El secreto SSH_KEY no contiene una clave privada válida."
            exit 1
          fi

      - name: Comprobar el respaldo del servidor
        env:
          HOST: ${{ secrets.SSH_HOST }}
          # Se llama USUARIO y no USER a propósito: USER es una variable del sistema.
          USUARIO: ${{ secrets.SSH_USER }}
          # Horas de antigüedad que se toleran. Con 30, una noche perdida no alarma
          # y dos seguidas sí.
          MAX_HORAS: "30"
        run: |
          set -uo pipefail

          # Función y no variable con el comando: una variable se expande por
          # palabras y un espacio invisible al final de un secreto parte los
          # argumentos. Con una función, cada argumento va entre comillas.
          ssh_sirve() {
            ssh -i "$HOME/.ssh/id_ed25519" \
                -o StrictHostKeyChecking=accept-new \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o ConnectTimeout=20 \
                "$USUARIO@$HOST" "$@"
          }

          if [ -z "${HOST:-}" ] || [ -z "${USUARIO:-}" ]; then
            echo "::error::Faltan los secretos SSH_HOST o SSH_USER."
            exit 1
          fi

          # Tres intentos: un corte de red momentáneo no debe dar una falsa alarma.
          for intento in 1 2 3; do
            echo "=== Intento $intento de 3 ==="
            if ssh_sirve "sudo -n bash /opt/sirve-p/mantenimiento/verificar-respaldo.sh $MAX_HORAS"; then
              echo "OK: el respaldo está al día."
              exit 0
            fi
            echo "El intento $intento no dio OK."
            if [ "$intento" -lt 3 ]; then sleep 30; fi
          done

          echo "::error::La comprobación falló tres veces seguidas. Mira el detalle de arriba: el respaldo automático puede estar caído."
          exit 1
